version: "1"

prompts:
  - node: synthesize-gaps
    name: synthesize-gaps-analysis
    description: "Analyze an article and multi-source research to produce a gap analysis identifying weaknesses, unexplored angles, and the best contrarian opportunity"
    model: claude-sonnet-4-5
    system_prompt: ""
    user_prompt_template: |
      You are an expert content strategist analyzing an article and research to find contrarian content opportunities.

      ## Original Article
      Title: {{input.fetch-article.title}}
      URL: {{input.fetch-article.url}}
      Published: {{input.fetch-article.publishedDate}}

      Content (first 3000 chars):
      {{input.fetch-article.content}}

      ## Supporting Research (agrees with thesis)
      {{input.research-supporting.sources}}

      ## Contrary Research (disagrees with thesis)
      {{input.research-contrary.sources}}

      ## Adjacent Research (tangential angles)
      {{input.research-adjacent.sources}}

      ## Your Task

      Analyze the article and all research to produce a gap analysis. Respond ONLY with JSON:

      {
        "mainThesis": "one-sentence summary of article's main argument",
        "supportStrength": "weak|moderate|strong — how well-supported is the thesis?",
        "weaknesses": ["list of specific logical gaps, missing evidence, or flawed assumptions"],
        "unexploredAngles": ["list of angles nobody is covering that are relevant"],
        "contrarian_opportunity": {
          "angle": "the single best contrarian angle for a response article",
          "evidence": "what evidence supports this contrarian take",
          "why_it_matters": "why readers should care about this angle"
        }
      }

  - node: generate-outline
    name: generate-response-outline
    description: "Generate a structured response article outline from the gap analysis including title options, thesis, sections, and a contrarian hook"
    model: claude-sonnet-4-5
    system_prompt: ""
    user_prompt_template: |
      You are an expert content strategist creating a response article outline.

      ## Gap Analysis
      Main thesis of original: {{input.mainThesis}}
      Support strength: {{input.supportStrength}}

      Weaknesses identified:
      {{input.weaknesses}}

      Unexplored angles:
      {{input.unexploredAngles}}

      Best contrarian opportunity:
      - Angle: {{input.contrarian_opportunity.angle}}
      - Evidence: {{input.contrarian_opportunity.evidence}}
      - Why it matters: {{input.contrarian_opportunity.why_it_matters}}

      ## Your Task

      Create a structured OUTLINE (not a full draft) for a response article. Respond ONLY with JSON:

      {
        "titleOptions": ["3 compelling title options"],
        "thesis": "one-sentence thesis for the response",
        "sections": [
          {
            "heading": "section heading",
            "keyPoints": ["bullet points of key arguments"],
            "supportingEvidence": ["specific data, quotes, or sources to cite"]
          }
        ],
        "contrarian_hook": "the opening hook that grabs attention by challenging conventional wisdom",
        "estimated_word_count": 1500
      }

      Rules:
      - 4-6 sections
      - Each section should have 2-4 key points
      - Include specific evidence references, not vague gestures
      - The hook should be provocative but intellectually honest
      - Target 1200-2000 words

templates:
  - node: store-and-notify
    name: content-research-slack-notification
    description: "Slack notification with research results including title options, contrarian hook, and section outline"
    format: slack-blocks
    template: |
      [
        {
          "type": "header",
          "text": { "type": "plain_text", "text": "Content Research Complete" }
        },
        {
          "type": "section",
          "text": {
            "type": "mrkdwn",
            "text": "*Target:* <{{config.target_url}}|{{config.target_url}}>\n*Hook:* {{input.contrarian_hook}}"
          }
        },
        {
          "type": "section",
          "text": {
            "type": "mrkdwn",
            "text": "*Title Options:*\n{{input.titleOptions}}"
          }
        },
        {
          "type": "section",
          "text": {
            "type": "mrkdwn",
            "text": "*Sections:*\n{{input.sections}}"
          }
        },
        {
          "type": "context",
          "elements": [
            { "type": "mrkdwn", "text": "~{{input.estimated_word_count}} words | Generated by Tentacular | {{timestamp}}" }
          ]
        }
      ]
