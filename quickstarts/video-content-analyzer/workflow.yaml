name: video-content-analyzer
version: "1.0"
description: "Extract frames from video via ffmpeg sidecar, deduplicate with perceptual hashing, analyze with batched Claude Vision, compile templated reports with editorial audit"

sidecars:
  - name: ffmpeg
    image: linuxserver/ffmpeg:latest
    port: 9000
    healthPath: /health
    command: ["bash", "-c"]
    args:
      - "echo  | base64 -d > /tmp/hook.pl && ARCH=$(uname -m) && if [ \"$ARCH\" = \"x86_64\" ] || [ \"$ARCH\" = \"amd64\" ]; then YT_BIN=yt-dlp_linux; else YT_BIN=yt-dlp_linux_aarch64; fi && echo \"Downloading $YT_BIN...\" && curl -fsSL \"https://github.com/yt-dlp/yt-dlp/releases/latest/download/$YT_BIN\" -o /tmp/yt-dlp && chmod +x /tmp/yt-dlp && echo \"yt-dlp ready\" && exec perl /tmp/hook.pl"
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

triggers:
  - type: manual

nodes:
  ingest-video:
    path: ./nodes/ingest-video.ts
  extract-frames:
    path: ./nodes/extract-frames.ts
  deduplicate-frames:
    path: ./nodes/deduplicate-frames.ts
  analyze-frames:
    path: ./nodes/analyze-frames.ts
  compile-report:
    path: ./nodes/compile-report.ts
  audit-and-publish:
    path: ./nodes/audit-and-publish.ts

edges:
  - from: ingest-video
    to: extract-frames
  - from: extract-frames
    to: deduplicate-frames
  - from: deduplicate-frames
    to: analyze-frames
  - from: analyze-frames
    to: compile-report
  - from: compile-report
    to: audit-and-publish

config:
  timeout: 600s
  retries: 0
  fps: 1
  output_format: jpg
  max_frames: 100
  dedup:
    hamming_threshold: 10
  analysis:
    batch_size: 10
  report:
    author: "Tentacular"
    style: "narrative"
  audit:
    enabled: true
    min_quality_score: 7

contract:
  version: "1"
  dependencies:
    anthropic:
      protocol: https
      host: api.anthropic.com
      port: 443
      auth:
        type: bearer-token
        secret: anthropic.api_key
    video-source:
      type: dynamic-target
      protocol: https
      cidr: "0.0.0.0/0"
      dynPorts:
        - "443/TCP"
        - "80/TCP"
    tentacular-rustfs:
      protocol: http
    tentacular-postgres:
      protocol: postgresql
    slack-webhook:
      protocol: https
      host: hooks.slack.com
      port: 443
      auth:
        type: webhook-url
        secret: slack.webhook_url
      channels:
        - name: default
          access: post
