version: "1"

prompts:
  - node: generate-report
    name: uptime-sre-analysis
    description: "Analyze endpoint uptime statistics to produce a narrative summary with regression detection, TLS warnings, latency outliers, and recommendations"
    model: claude-sonnet-4-5
    system_prompt: |
      You are an SRE analyst generating a weekly uptime report. Analyze the provided endpoint statistics and produce:

      1. A narrative summary (2-3 paragraphs) highlighting:
         - Overall uptime trends
         - Any regressions or degradations
         - TLS certificate warnings (expiring within 30 days)
         - Latency outliers (p95 > 1000ms)
      2. Key recommendations

      Return a JSON object:
      {
        "narrative": "<markdown formatted summary>",
        "recommendations": ["<rec1>", "<rec2>", ...]
      }

      Respond with valid JSON only, no markdown fences.
    user_prompt_template: |
      {{input.aggregate_stats_json}}

templates:
  - node: generate-report
    name: uptime-html-report
    description: "HTML weekly uptime report with endpoint statistics table, LLM narrative, and recommendations"
    format: html
    template: |
      <!DOCTYPE html>
      <html><head><title>Weekly Uptime Report</title></head>
      <body>
      <h1>Weekly Uptime Report</h1>
      <p>Period: {{data.periodStart}} to {{data.periodEnd}}</p>
      <p>Overall uptime: <strong>{{data.overallUptimePct}}%</strong></p>
      <h2>Analysis</h2>
      <div>{{narrative}}</div>
      <h2>Endpoint Statistics</h2>
      <table>
        <thead><tr>
          <th>Endpoint</th><th>Uptime</th><th>p50</th><th>p95</th><th>p99</th><th>Errors</th><th>TLS Expiry</th>
        </tr></thead>
        <tbody>{{endpoint_rows}}</tbody>
      </table>
      <h2>Recommendations</h2>
      <ul>{{recommendation_items}}</ul>
      <p><em>Generated by tentacular/uptime-tracker v1.0</em></p>
      </body></html>

  - node: alert-failures
    name: uptime-alert-slack-notification
    description: "Immediate Slack alert for unhealthy endpoints with status, latency, and error details"
    format: slack-blocks
    template: |
      [
        {
          "type": "header",
          "text": { "type": "plain_text", "text": "Uptime Alert", "emoji": true }
        },
        {
          "type": "section",
          "text": {
            "type": "mrkdwn",
            "text": ":red_circle: {{unhealthyCount}} endpoint(s) unhealthy at {{probedAt}}"
          }
        },
        {
          "type": "section",
          "text": {
            "type": "mrkdwn",
            "text": ":warning: *{{endpoint.url}}*\nStatus: {{endpoint.statusCode}} | Latency: {{endpoint.responseTimeMs}}ms | Error: {{endpoint.error}}"
          }
        },
        {
          "type": "context",
          "elements": [
            { "type": "mrkdwn", "text": "tentacular/uptime-tracker v1.0" }
          ]
        }
      ]

  - node: publish-report
    name: uptime-weekly-slack-summary
    description: "Slack summary notification for the weekly uptime report with overall uptime percentage and report link"
    format: slack-blocks
    template: |
      [
        {
          "type": "header",
          "text": { "type": "plain_text", "text": "Weekly Uptime Report", "emoji": true }
        },
        {
          "type": "section",
          "text": {
            "type": "mrkdwn",
            "text": "*Overall Uptime: {{data.overallUptimePct}}%*\nPeriod: {{periodStart}} to {{periodEnd}}\n\n{{data.summary}}"
          }
        },
        {
          "type": "section",
          "text": {
            "type": "mrkdwn",
            "text": "Full report stored at: `{{reportPath}}`"
          }
        },
        {
          "type": "context",
          "elements": [
            { "type": "mrkdwn", "text": "tentacular/uptime-tracker v1.0" }
          ]
        }
      ]
