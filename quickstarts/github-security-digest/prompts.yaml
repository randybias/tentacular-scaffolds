version: "1"

prompts:
  - node: prioritize-summarize
    name: prioritize-security-alerts
    description: "Analyze new Dependabot security alerts, group by severity, and produce a prioritized digest with recommended actions"
    model: claude-sonnet-4-5
    system_prompt: ""
    user_prompt_template: |
      You are a security analyst. Analyze these new Dependabot security alerts and produce a prioritized digest.

      Group alerts by severity (Critical, High, Medium, Low). For each group, list the alerts.
      Highlight the top 3 most critical items with specific recommended actions (e.g., "upgrade package X to version Y").
      Be concise and actionable. Output in Markdown format.

      Alerts:
      {{input.netNewAlerts}}

templates:
  - node: notify-slack
    name: security-digest-slack-notification
    description: "Slack notification with security digest summary including severity counts and top priority items"
    format: slack-blocks
    template: |
      [
        {
          "type": "header",
          "text": { "type": "plain_text", "text": "Security Digest: {{input.totalNew}} New Alerts" }
        },
        {
          "type": "section",
          "text": {
            "type": "mrkdwn",
            "text": ":rotating_light: Critical: *{{input.criticalCount}}*  |  :warning: High: *{{input.highCount}}*  |  :large_yellow_circle: Medium: *{{input.mediumCount}}*  |  :white_circle: Low: *{{input.lowCount}}*"
          }
        },
        {
          "type": "section",
          "text": {
            "type": "mrkdwn",
            "text": "*Top Priority Items:*\n{{input.topItems}}"
          }
        },
        {
          "type": "section",
          "text": {
            "type": "mrkdwn",
            "text": "{{input.digestMarkdown}}"
          }
        },
        { "type": "divider" },
        {
          "type": "context",
          "elements": [
            { "type": "mrkdwn", "text": "Generated by Tentacular GitHub Security Digest | {{timestamp}}" }
          ]
        }
      ]
