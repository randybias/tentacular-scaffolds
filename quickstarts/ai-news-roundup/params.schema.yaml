version: "1"
description: "Parameters for the ai-news-roundup scaffold"

parameters:
  sources:
    path: config.sources
    type: list
    items: map
    description: >
      News feed sources to aggregate. Each entry has a name (string), url (string),
      and type (string: "rss" or "json").
    required: true
    example:
      - name: "Example Tech Blog"
        url: "https://example.com/feed"
        type: rss

  openai_model:
    path: config.openai_model
    type: string
    description: "OpenAI model to use for summarization"
    required: false
    default: "gpt-4o"
    example: "gpt-4o"

  digest_schedule:
    path: triggers[name=daily-roundup].schedule
    type: string
    description: "Cron expression for when to send the daily digest"
    required: false
    default: "0 7 * * *"
    example: "0 7 * * *"
