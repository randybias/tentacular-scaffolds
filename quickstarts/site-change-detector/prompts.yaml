version: "1"

prompts:
  - node: summarize-changes
    name: site-change-summary
    description: "Summarize web page changes in plain business language, filtering out boilerplate changes"
    model: claude-sonnet-4-5
    user_prompt_template: |
      You are monitoring a web page for meaningful changes. Analyze the following diff and summarize what changed in plain business language.

      Ignore boilerplate changes like:
      - Navigation menu updates
      - Footer text changes
      - Date/time stamps updating
      - Cookie banners or ad content

      Focus on substantive content changes: new announcements, pricing changes, policy updates, feature additions, etc.

      If the changes are only boilerplate, respond with "No meaningful changes detected."

      URL: {{input.page.url}}

      Diff (- = removed, + = added):
      {{input.truncatedDiff}}

      Provide a brief 1-3 sentence summary.

templates:
  - node: notify-slack
    name: site-change-slack-alert
    description: "Slack notification for detected site changes with per-page summaries"
    format: slack-blocks
    template: |
      [
        {
          "type": "header",
          "text": { "type": "plain_text", "text": "Site Changes Detected: {{input.totalChanged}} page(s)" }
        },
        {{#each input.summaries}}
        {
          "type": "section",
          "text": {
            "type": "mrkdwn",
            "text": ":eyes: *<{{this.url}}|{{this.hostname}}>*\n{{this.summary}}"
          }
        },
        {{/each}}
        { "type": "divider" },
        {
          "type": "context",
          "elements": [
            { "type": "mrkdwn", "text": "Generated by Tentacular Site Change Detector | {{timestamp}}" }
          ]
        }
      ]
