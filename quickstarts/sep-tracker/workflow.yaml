name: sep-tracker
version: "1.0"
description: "Track MCP SEP proposals from GitHub PRs, diff changes, generate HTML reports, store to Postgres, notify Slack"

metadata:
  owner: platform-team
  team: mcp-tracking
  tags:
    - production
    - reporting
  environment: dev

deployment:
  namespace: pd-sep-tracker

triggers:
  - type: manual
  - type: cron
    name: weekly-sunday
    schedule: "0 20 * * 0"

nodes:
  fetch-seps:
    path: ./nodes/fetch-seps.ts
  diff-seps:
    path: ./nodes/diff-seps.ts
  render-html:
    path: ./nodes/render-html.ts
  store-report:
    path: ./nodes/store-report.ts
  notify:
    path: ./nodes/notify.ts

edges:
  - from: fetch-seps
    to: diff-seps
  - from: diff-seps
    to: render-html
  - from: fetch-seps
    to: render-html
  - from: fetch-seps
    to: store-report
  - from: render-html
    to: store-report
  - from: diff-seps
    to: store-report
  - from: store-report
    to: notify
  - from: diff-seps
    to: notify

config:
  timeout: 120s
  retries: 1
  target_repo: "my-org/my-spec-repo"
  sep_label: "sep"

contract:
  version: "1"
  dependencies:
    github:
      protocol: https
      host: api.github.com
      port: 443
      auth:
        type: api-token
        secret: github.token
    tentacular-postgres:
      protocol: postgresql
    azure-blob:
      protocol: https
      host: mystorageaccount.blob.core.windows.net
      port: 443
      auth:
        type: sas-token
        secret: azure.sas_token
    slack-webhook:
      protocol: https
      host: hooks.slack.com
      port: 443
      auth:
        type: webhook-url
        secret: slack.webhook_url
      channels:
        - name: default
          access: post
