version: "1"

prompts:
  - node: enrich-website
    name: website-analysis
    description: "Analyze a company homepage and extract structured data about what the company does, its target market, and recent activity"
    model: claude-sonnet-4-5
    user_prompt_template: |
      Analyze this company homepage text and respond ONLY with JSON:

      Homepage text from {{input.domain}}:
      {{input.pageText}}

      {
        "summary": "2-3 sentence description of what this company does",
        "targetMarket": "who they sell to (e.g., 'Enterprise SaaS buyers', 'SMB retail')",
        "recentActivity": "any recent news, product launches, or announcements visible on the page"
      }

  - node: score-leads
    name: icp-lead-scoring
    description: "Score a sales lead against Ideal Customer Profile criteria using enriched company, person, and website data"
    model: claude-sonnet-4-5
    user_prompt_template: |
      Score this sales lead against our Ideal Customer Profile (ICP). Respond ONLY with JSON.

      ## ICP Criteria
      {{config.icp_criteria}}

      ## Lead Data
      Name: {{input.lead.name}}
      Email: {{input.lead.email}}
      Company: {{input.lead.company}}
      Notes: {{input.lead.notes}}

      ## Company Enrichment
      Industry: {{input.company.industry}}
      Size: {{input.company.size}}
      Funding: {{input.company.funding}}
      Tech Stack: {{input.company.techStack}}
      Domain: {{input.company.domain}}

      ## Person Enrichment
      Title: {{input.person.title}}
      Seniority: {{input.person.seniority}}
      LinkedIn: {{input.person.linkedin}}

      ## Website Summary
      {{input.website.summary}}
      Target Market: {{input.website.targetMarket}}
      Recent Activity: {{input.website.recentActivity}}

      ## Respond with:
      {
        "score": <1-100>,
        "explanation": "2-3 sentence explanation of score",
        "icp_fit_details": "specific matches/mismatches against each ICP criterion"
      }

templates:
  - node: store-and-route
    name: high-score-slack-alert
    description: "Slack notification for high-score leads (score >= 70) with ICP match details"
    format: slack-blocks
    template: |
      [
        {
          "type": "header",
          "text": { "type": "plain_text", "text": "{{input.highScoreCount}} High-Score Lead(s) Detected" }
        },
        {
          "type": "section",
          "text": {
            "type": "mrkdwn",
            "text": "*ICP-matched leads (score >= 70):*\n{{#each input.highScoreLeads}}  - *{{this.lead.name}}* ({{this.lead.company}}) - Score: *{{this.score}}* - {{this.explanation}}\n{{/each}}"
          }
        },
        {
          "type": "context",
          "elements": [
            { "type": "mrkdwn", "text": "{{input.lowScoreCount}} low-score lead(s) logged for batch review | Generated by Tentacular | {{timestamp}}" }
          ]
        }
      ]
