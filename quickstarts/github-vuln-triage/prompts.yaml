version: "1"

prompts:
  - node: triage
    name: triage-vulnerability-alerts
    description: "AI-powered triage of enriched vulnerability alerts based on severity, repo criticality, CVSS score, and exposure"
    model: claude-sonnet-4-5
    system_prompt: ""
    user_prompt_template: |
      You are a security engineer triaging vulnerability alerts. Prioritize based on:
      - Severity (critical > high > medium > low)
      - Repo criticality (customer_facing + production = highest)
      - CVSS score
      - Exposure (public-facing services > internal tools)

      ## Alerts to Triage
      {{input.alerts}}

      ## Respond with JSON (array of objects, one per alert index):
      [
        {
          "index": 0,
          "priority": "critical_action|high_track|low_log",
          "reason": "brief explanation of priority decision",
          "remediation": "specific remediation steps"
        }
      ]

      Rules:
      - critical_action: needs immediate GitHub Issue + Slack alert. Use for: critical/high severity in customer-facing production repos, or any CVSS >= 9.0
      - high_track: needs tracking in weekly report. Use for: medium severity in production, or high severity in internal repos
      - low_log: log only. Use for: low severity, or anything in non-production environments

templates:
  - node: create-issues
    name: vuln-triage-github-issue
    description: "GitHub issue body for critical vulnerability findings with alert details, triage reason, and suggested remediation"
    format: markdown
    template: |
      ## Security Alert

      | Field | Value |
      |-------|-------|
      | **Source** | {{alert.source}} |
      | **Severity** | {{alert.severity}} |
      | **CVSS** | {{alert.cvss}} |
      | **Package/Rule** | `{{alert.identifier}}` |
      | **Alert** | [View on GitHub]({{alert.htmlUrl}}) |
      | **Team** | {{alert.repoContext.team}} |
      | **Environment** | {{alert.repoContext.environment}} |
      | **Customer-facing** | {{alert.repoContext.customer_facing}} |

      ### Summary

      {{alert.summary}}

      ### Triage Reason

      {{alert.triageReason}}

      ### Suggested Remediation

      {{alert.suggestedRemediation}}

      ---
      *Auto-created by Tentacular GitHub Vulnerability Triage*

  - node: alert-critical
    name: vuln-triage-critical-slack-alert
    description: "Slack notification for critical vulnerability findings with issue links and triage summary"
    format: slack-blocks
    template: |
      [
        {
          "type": "header",
          "text": { "type": "plain_text", "text": "CRITICAL: {{input.triage.criticalAction.length}} Vulnerability Alert(s)" }
        },
        {
          "type": "section",
          "text": {
            "type": "mrkdwn",
            "text": "{{input.triage.criticalAction}}"
          }
        },
        {
          "type": "section",
          "text": {
            "type": "mrkdwn",
            "text": "*Summary:* {{input.triage.totalTriaged}} total alerts triaged | {{input.triage.criticalAction.length}} critical | {{input.triage.highTrack.length}} high | {{input.triage.lowLog.length}} low"
          }
        },
        {
          "type": "context",
          "elements": [
            { "type": "mrkdwn", "text": "Generated by Tentacular GitHub Vulnerability Triage | {{timestamp}}" }
          ]
        }
      ]
