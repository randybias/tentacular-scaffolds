version: "1"

prompts:
  - node: generate-report
    name: sep-ecosystem-analysis
    description: "Analyze SEP activity data and metrics to produce a structured weekly digest with health scoring, velocity assessment, and actionable recommendations"
    model: gpt-4o
    system_prompt: |
      You are a technical analyst reviewing SEP (Specification Enhancement Proposal) activity for the Model Context Protocol specification repository.

      Analyze the provided SEP data and activity metrics. Produce a structured JSON response with:
      - "analysis": A 2-3 paragraph summary of the overall SEP ecosystem health, velocity trends, and notable activity.
      - "recommendations": An array of 3-5 actionable recommendations for specification maintainers.
      - "healthScore": An integer 0-100 representing overall ecosystem health based on:
        - Velocity score (are proposals actively moving?)
        - Inactivity ratio (are many proposals stalled?)
        - New proposal rate (is the community engaged?)
        - State transitions (are proposals progressing through stages?)
      - "sections": An array of report sections, each with "title" and "content" fields. Include sections for:
        - "Velocity Assessment" - which SEPs are moving quickly and why
        - "Inactivity Flags" - which SEPs appear stalled and may need attention
        - "New Proposals" - overview of newly submitted SEPs
        - "State Changes" - notable transitions between states
        - "Week-over-Week Trends" - how metrics changed compared to last week

      Respond with valid JSON only, no markdown fences.
    user_prompt_template: |
      {{input.snapshot_and_metrics_json}}

templates:
  - node: render-html
    name: sep-digest-html-report
    description: "Styled HTML weekly digest report with health score, metrics bar, SEP tables, trends, and recommendations"
    format: html
    template: |
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <title>SEP Weekly Digest - {{date}}</title>
      </head>
      <body>
        <div class="container">
          <div class="header">
            <h1>SEP Weekly Digest</h1>
            <div class="subtitle">{{date}}</div>
          </div>
          <div class="health-score">
            <div class="score" style="color: {{scoreColor}}">{{score}}</div>
            <div class="score-label" style="color: {{scoreColor}}">{{scoreLabel}}</div>
            <div class="score-sublabel">Health Score (0-100)</div>
          </div>
          <div class="metrics-bar">
            <div class="metric"><div class="value">{{metrics.totalActive}}</div><div class="label">Active</div></div>
            <div class="metric"><div class="value">{{metrics.totalInactive}}</div><div class="label">Inactive</div></div>
            <div class="metric"><div class="value">{{metrics.newThisWeek.length}}</div><div class="label">New This Week</div></div>
            <div class="metric"><div class="value">{{metrics.closedThisWeek.length}}</div><div class="label">Closed This Week</div></div>
            <div class="metric"><div class="value">{{metrics.velocityScore}}</div><div class="label">Velocity</div></div>
          </div>
          <!-- LLM analysis sections -->
          <!-- High-Velocity SEPs table -->
          <!-- Inactive SEPs table -->
          <!-- Week-over-Week Trends table -->
          <!-- Recommendations list -->
          <div class="footer">Generated by Tentacular SEP Weekly Digest | {{timestamp}}</div>
        </div>
      </body>
      </html>

  - node: notify
    name: sep-digest-slack-notification
    description: "Slack Block Kit notification with SEP health and velocity summary, active SEP links, and report button"
    format: slack-blocks
    template: |
      [
        {
          "type": "header",
          "text": { "type": "plain_text", "text": "SEP Weekly Digest" }
        },
        {
          "type": "section",
          "text": {
            "type": "mrkdwn",
            "text": ":bar_chart: *Health & Velocity*\nVelocity Score: *{{metrics.velocityScore}}* | Active: *{{metrics.totalActive}}* | Inactive: *{{metrics.totalInactive}}*"
          }
        },
        {
          "type": "section",
          "fields": [
            { "type": "mrkdwn", "text": ":rocket: *High Velocity*\n{{metrics.highVelocity.length}} SEPs" },
            { "type": "mrkdwn", "text": ":zzz: *Inactive*\n{{metrics.inactive.length}} SEPs" },
            { "type": "mrkdwn", "text": ":new: *New This Week*\n{{metrics.newThisWeek.length}} SEPs" },
            { "type": "mrkdwn", "text": ":checkered_flag: *Closed This Week*\n{{metrics.closedThisWeek.length}} SEPs" }
          ]
        },
        {
          "type": "actions",
          "elements": [
            {
              "type": "button",
              "text": { "type": "plain_text", "text": "View Full Digest" },
              "url": "{{publish.reportUrl}}",
              "style": "primary"
            }
          ]
        },
        {
          "type": "context",
          "elements": [{ "type": "mrkdwn", "text": "Generated by Tentacular SEP Weekly Digest | {{timestamp}}" }]
        }
      ]
