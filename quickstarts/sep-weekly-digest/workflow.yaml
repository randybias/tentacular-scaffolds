name: sep-weekly-digest
version: "1.0"
description: "Weekly SEP activity digest with LLM-powered analysis, trend tracking, and health scoring"

deployment:
  namespace: pd-sep-tracker

triggers:
  - type: manual
  - type: cron
    name: weekly-sunday
    schedule: "0 20 * * 0"

nodes:
  fetch-seps:
    path: ./nodes/fetch-seps.ts
  store-snapshots:
    path: ./nodes/store-snapshots.ts
  analyze-activity:
    path: ./nodes/analyze-activity.ts
  generate-report:
    path: ./nodes/generate-report.ts
  render-html:
    path: ./nodes/render-html.ts
  publish-report:
    path: ./nodes/publish-report.ts
  notify:
    path: ./nodes/notify.ts

edges:
  - from: fetch-seps
    to: store-snapshots
  - from: store-snapshots
    to: analyze-activity
  - from: fetch-seps
    to: generate-report
  - from: analyze-activity
    to: generate-report
  - from: generate-report
    to: render-html
  - from: analyze-activity
    to: render-html
  - from: render-html
    to: publish-report
  - from: publish-report
    to: notify
  - from: analyze-activity
    to: notify

config:
  timeout: 180s
  retries: 1
  target_repo: "my-org/my-spec-repo"
  sep_label: "sep"
  azure_blob_base_url: "https://mystorageaccount.blob.core.windows.net/sep-reports"

contract:
  version: "1"
  dependencies:
    github:
      protocol: https
      host: api.github.com
      port: 443
      auth:
        type: api-token
        secret: github.token
    tentacular-postgres:
      protocol: postgresql
    openai:
      protocol: https
      host: api.openai.com
      port: 443
      auth:
        type: api-token
        secret: openai.api_key
    azure-blob:
      protocol: https
      host: mystorageaccount.blob.core.windows.net
      port: 443
      auth:
        type: sas-token
        secret: azure.sas_token
    slack-webhook:
      protocol: https
      host: hooks.slack.com
      port: 443
      auth:
        type: webhook-url
        secret: slack.webhook_url
      channels:
        - name: default
          access: post
