version: "1"

prompts:
  - node: generate-analysis
    name: agent-comparative-analysis
    description: "Compare open-source AI agent project metrics (Codex, Gemini CLI, Goose) to produce a narrative analysis with health scores, highlights, and momentum prediction"
    model: gpt-4o
    system_prompt: |
      You are a technical analyst comparing open-source AI agent projects.

      Analyze the provided metrics for 3 AI agent repositories (Codex, Gemini CLI, Goose). Produce a structured JSON response with:
      - "narrative": A 2-3 paragraph comparative analysis covering community engagement, development velocity, and ecosystem maturity.
      - "highlights": An array of 3-5 key findings (strings).
      - "prediction": A single sentence predicting which project has the most momentum going forward.
      - "healthScores": An object mapping each repo name to a 0-100 health score based on stars, velocity, contributor count, issue activity, and release cadence.

      Respond with valid JSON only, no markdown fences.
    user_prompt_template: |
      {{input.composite_metrics_json}}

templates:
  - node: render-html
    name: agent-report-html
    description: "Styled HTML report with health scores, rankings table, per-repo detail cards with sparkline trends, narrative analysis, highlights, and momentum prediction"
    format: html
    template: |
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <title>AI Agent Activity Report - {{date}}</title>
      </head>
      <body>
        <div class="container">
          <div class="header">
            <h1>AI Agent Activity Report</h1>
            <div class="subtitle">{{date}}</div>
          </div>
          <div class="totals-bar">
            <div class="metric"><div class="value">{{totals.totalStars}}</div><div class="label">Total Stars</div></div>
            <div class="metric"><div class="value">{{totals.totalForks}}</div><div class="label">Total Forks</div></div>
            <div class="metric"><div class="value">{{totals.totalOpenIssues}}</div><div class="label">Open Issues</div></div>
            <div class="metric"><div class="value">{{totals.totalRecentCommits}}</div><div class="label">Recent Commits</div></div>
          </div>
          <!-- Health Scores grid -->
          <!-- Rankings table: Stars, Velocity, Commits, Issues -->
          <!-- Per-repo detail cards with sparkline weekly commit trends -->
          <!-- Narrative analysis paragraphs -->
          <!-- Key highlights list -->
          <!-- Momentum prediction callout -->
          <div class="footer">Generated by Tentacular Agent Activity Report | {{timestamp}}</div>
        </div>
      </body>
      </html>

  - node: notify
    name: agent-report-slack-notification
    description: "Slack Block Kit notification with rankings summary, per-repo stats, totals, and report link button"
    format: slack-blocks
    template: |
      [
        {
          "type": "header",
          "text": { "type": "plain_text", "text": "AI Agent Activity Report" }
        },
        {
          "type": "section",
          "text": {
            "type": "mrkdwn",
            "text": ":bar_chart: *Rankings Summary*\n*By Stars:* {{rankings.byStars}}\n*By Velocity:* {{rankings.byVelocity}}"
          }
        },
        {
          "type": "section",
          "fields": [
            {
              "type": "mrkdwn",
              "text": "*{{repo.name}}*\n:star: {{repo.stars}} stars\n:rocket: {{repo.velocity}} velocity\n:busts_in_silhouette: {{repo.contributorCount}} contributors\n:git: {{repo.recentCommits}} recent commits"
            }
          ]
        },
        {
          "type": "section",
          "text": {
            "type": "mrkdwn",
            "text": ":chart_with_upwards_trend: *Totals*\nStars: *{{totals.totalStars}}* | Forks: *{{totals.totalForks}}* | Issues: *{{totals.totalOpenIssues}}* | Commits: *{{totals.totalRecentCommits}}*"
          }
        },
        {
          "type": "actions",
          "elements": [
            {
              "type": "button",
              "text": { "type": "plain_text", "text": "View Full Report" },
              "url": "{{publish.reportUrl}}",
              "style": "primary"
            }
          ]
        },
        {
          "type": "context",
          "elements": [{ "type": "mrkdwn", "text": "Generated by Tentacular Agent Activity Report | {{timestamp}}" }]
        }
      ]
